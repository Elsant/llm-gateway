name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: vet + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    name: test (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - name: fuzz (short)
        run: |
          go test -run='^$' -fuzz=FuzzDecodeResponse -fuzztime=15s ./internal/provider/anthropic
          go test -run='^$' -fuzz=FuzzParseAPIError -fuzztime=15s ./internal/provider/anthropic
