version: "2"

run:
  timeout: 5m

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose      # resp.Body is closed
    - errorlint      # errors.Is/As instead of == and type assertions on errors
    - gocritic
    - misspell
    - nolintlint     # no unexplained //nolint
    - revive         # golint successor: naming, doc comments
    - unconvert
    - unparam
    - usestdlibvars  # http.MethodPost, http.StatusOK, ...
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # readability over struct packing for now
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/elsant/llm-gateway
